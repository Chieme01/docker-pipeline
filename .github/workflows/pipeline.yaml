    #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    #   with:
    #     image: ${{ secrets.ACR_NAME }}.azurecr.io/app:${{ github.sha }}
    #     args: --severity-threshold=medium --file=docker/Dockerfile

    # - name: Upload result to GitHub Code Scanning
    #   uses: github/codeql-action/upload-sarif@v4
    #   with:
    #     sarif_file: snyk.sarif

    # - name: Push to ACR
    #   # Only push if we are on the main branch
    #   if: github.ref == 'refs/heads/main'
    #   run: docker push ${{ secrets.ACR_NAME }}.azurecr.io/app:${{ github.sha }}

  # Job 2: Handles the GitOps repository update
  update-gitops:
    runs-on: ubuntu-latest
    needs: build-scan-push # Strict dependency: Only runs if the build job succeeds
    # if: github.ref == 'refs/heads/main' # Only run deployments for main branch pushes
    environment: azure-prod

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: Chieme01/kubernetes-argocd-application-configuration
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Update Image Tag in deployment.yaml
        run: |
          cd gitops-repo
          sed -i 's|image:\s*${{ secrets.ACR_NAME }}.azurecr.io/app:.*|image: ${{ secrets.ACR_NAME }}.azurecr.io/app:${{ github.sha }}|g' manifests/deployment.yaml

      - name: Commit and Push Changes to GitOps Repo
        run: |
          cd gitops-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add manifests/deployment.yaml
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes detected in deployment.yaml. Skipping commit."
          else
            git commit -m "Update application image tag to ${{ github.sha }}"
            git push origin main
          fi
          